name: CI

# Manual only: run from the Actions tab (workflow_dispatch). Only users with
# write access to this repository can trigger it.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game:
    name: assemble game + run console tests
    runs-on: ubuntu-latest
    container: nickblah/luajit:2.1-luarocks-ubuntu
    steps:
      - uses: actions/checkout@v4
      - name: git
        run: apt-get update -qq && apt-get install -y -qq git zip >/dev/null
      - name: assemble (upstream + overlay + patches)
        run: sh tools/assemble.sh
      - name: console test suites
        working-directory: work/game
        run: |
          fail=0
          for t in $(cd ../../overlay/tests/engine && ls *.lua) launcher_nx_pad_cursor_test.lua rom_pick_error_bug442.lua uwp_baseroms_test.lua; do
            printf '%-45s ' "$t"
            if luajit "tests/engine/$t" 2>&1 | tail -1; then :; else fail=1; fi
          done
          exit $fail
      - uses: actions/upload-artifact@v4
        with:
          name: game
          path: work/game
          retention-days: 7

  engine:
    name: build LÖVE Potion (3DS)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: cmake + ninja
        working-directory: engine
        run: |
          cmake -S . -B build -Wno-dev >/dev/null
          ninja -C build
          ls -la build/lovepotion.3dsx build/lovepotion.elf
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine/build/lovepotion.3dsx
            engine/build/lovepotion.elf
          retention-days: 7
