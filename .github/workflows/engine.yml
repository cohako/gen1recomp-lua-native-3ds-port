name: Engine build

# Runs on pull requests that touch the engine or the CIA packaging, and by hand
# from the Actions tab: compiles the LÖVE Potion fork for the 3DS and uploads
# the 3dsx, the ELF (symbols for crash dumps) and a CIA.  A build check only:
# whether the result runs is still answered on the console.
on:
  pull_request:
    branches: [master]
    paths:
      - 'engine/**'
      - 'tools/cia/**'
      - '.github/workflows/engine.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: build LÖVE Potion (3DS)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: cmake + ninja
        working-directory: engine
        run: |
          cmake -G Ninja -S . -B build -Wno-dev -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/3DS.cmake >/dev/null
          ninja -C build
          ls -la build/lovepotion.3dsx build/lovepotion.elf
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engine
          path: |
            engine/build/lovepotion.3dsx
            engine/build/lovepotion.elf
          retention-days: 14

  cia:
    name: pack CIA
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: engine, path: engine-out }
      # The CIA carries the game tree, so pack the real thing: without
      # work/game make_cia.sh would silently ship an engine-only RomFS.
      - name: assemble (upstream + overlay + patches)
        run: sh tools/assemble.sh
      - run: test -d work/game && sh tools/cia/make_cia.sh engine-out/lovepotion.elf dist/gen1recomp.cia
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cia
          path: dist/gen1recomp.cia
          retention-days: 14
