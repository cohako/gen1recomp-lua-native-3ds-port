name: Engine build

# Manual only (Actions tab -> Run workflow): compiles the LÖVE Potion fork for
# the 3DS and uploads the 3dsx, the ELF (symbols for crash dumps) and a CIA.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    name: build LÖVE Potion (3DS)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: cmake + ninja
        working-directory: engine
        run: |
          cmake -S . -B build -Wno-dev >/dev/null
          ninja -C build
          ls -la build/lovepotion.3dsx build/lovepotion.elf
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine/build/lovepotion.3dsx
            engine/build/lovepotion.elf
          retention-days: 14

  cia:
    name: pack CIA
    needs: engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: engine, path: engine-out }
      - run: sh tools/cia/make_cia.sh engine-out/lovepotion.elf dist/gen1recomp.cia
      - uses: actions/upload-artifact@v4
        with:
          name: cia
          path: dist/gen1recomp.cia
          retention-days: 14
