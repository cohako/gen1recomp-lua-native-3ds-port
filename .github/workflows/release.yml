name: Release

# Manual only.  Run from the Actions tab with the tag to publish (e.g. v0.1.0);
# the tag must already exist on master.  Builds everything from that tag and
# creates the GitHub Release with the SD-card zip, the CIA and the engine ELF.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  game:
    name: assemble game
    runs-on: ubuntu-latest
    container: nickblah/luajit:2.1-luarocks-ubuntu
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - run: apt-get update -qq && apt-get install -y -qq git >/dev/null
      - run: sh tools/assemble.sh
      - uses: actions/upload-artifact@v4
        with: { name: game, path: work/game }

  engine:
    name: build LÖVE Potion (3DS)
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - working-directory: engine
        run: cmake -S . -B build -Wno-dev >/dev/null && ninja -C build
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            engine/build/lovepotion.3dsx
            engine/build/lovepotion.elf

  release:
    name: package + publish
    needs: [game, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.tag }}" }
      - uses: actions/download-artifact@v4
        with: { name: game, path: work/game }
      - uses: actions/download-artifact@v4
        with: { name: engine, path: engine-out }
      - name: zip (SD card layout)
        run: sh tools/package.sh engine-out/lovepotion.3dsx "${{ inputs.tag }}"
      - name: CIA
        run: sh tools/cia/make_cia.sh engine-out/lovepotion.elf dist/gen1recomp.cia "${{ inputs.tag }}"
      - name: publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            dist/gen1recomp-3ds-*.zip
            dist/gen1recomp.cia
            engine-out/lovepotion.elf
